# Config nginx untuk Adminer + Self-Service Registration
# Copy ke /etc/nginx/sites-available/moodle
# Tambahkan blok di dalam server { server_name lmsmoodletest.xyz; ... }

# === Adminer ===
location = /adminer {
    return 301 /adminer/;
}

location /adminer/ {
    alias /var/www/adminer/;
    index index.php;
    auth_basic "Adminer - Login Dulu";
    auth_basic_user_file /etc/nginx/.htpasswd-adminer;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }
}

# === Self-service ===
location ~ ^/db-register/?$ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/adminer/register.php;
}
